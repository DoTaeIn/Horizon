[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "horizon-world"
version = "0.1.0"
description = "Lossless uint16 heightmap compression experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "zstandard>=0.23,<1", "lz4>=4,<5"]

[tool.setuptools.packages.find]
include = ["horizon*"]
